secrets:
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4
    - uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: gitleaks/gitleaks-action@v2
  env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
